<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ঢাকার রাস্তা</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,"Noto Sans Bengali",Vrinda,sans-serif;touch-action:none}
#g{display:block;width:100%;height:100%}
.hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:rgba(0,0,0,.55);padding:8px 12px;border-radius:12px;font-size:14px}
#spd{font-size:26px;font-weight:700}
#mm{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:170px;height:170px;border:2px solid #fff;border-radius:12px;background:#111}
.tc{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px}
.tc button{width:64px;height:64px;border-radius:50%;border:2px solid #fff8;background:#0006;color:#fff;font-size:22px}
#ov{position:fixed;inset:0;background:linear-gradient(160deg,#0b3d2e,#7a1010);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
#ov div{max-width:420px}
h1{font-size:40px;margin:0 0 6px}
.v button,#st{border:0;border-radius:12px;padding:12px 16px;margin:4px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:#ffffff26}
.v button.on{background:#f0b429;color:#111}
#st{background:#e53935;font-size:20px;margin-top:12px}
small{opacity:.8;display:block;margin-top:14px;line-height:1.6}
#dlb{background:#1e88e5;border:0;border-radius:12px;padding:12px 16px;margin:4px;font-size:16px;font-weight:700;cursor:pointer;color:#fff}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#c62828;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="hud"><div id="spd">0</div>কিমি/ঘণ্টা<br><span id="vn"></span><br><b id="mn" style="color:#69f0ae"></b><br><span id="ob"></span><br><button id="gb" style="margin:2px 0;padding:6px 10px;border-radius:8px;border:0;background:#f0b429;font-weight:700">🏪 গ্যারেজ (G)</button><br><b id="fn" style="color:#ff8a80">জরিমানা: ৳0</b><br><small style="margin:4px 0 0">W/A/S/D বা তীর · Space ব্রেক · H হর্ন · 1 রিকশা 2 গাড়ি 3 বাস · G গ্যারেজ</small></div>
<canvas id="mm" width="170" height="170"></canvas>
<div id="toast"></div><div id="gar" style="display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:5"><div id="gp" style="background:#1b1f2a;padding:18px;border-radius:16px;min-width:280px;text-align:center"></div></div>
<div class="tc" style="left:12px"><button data-k="KeyA">◀</button><button data-k="KeyD">▶</button></div>
<div class="tc" style="right:12px"><button data-k="KeyS">⏹</button><button data-k="KeyW">▲</button></div>
<div id="ov"><div>
<h1>ঢাকার রাস্তা</h1>
<p>বাংলাদেশি শহরের ব্যস্ত রাস্তায় চালাও রিকশা, গাড়ি আর বাস। ট্রাফিক, পথচারী, স্ট্রিটলাইট ও উন্নত গ্রাফিক্স!</p>
<div class="v"><button data-v="rick" class="on">🛺 রিকশা</button><button data-v="car">🚗 গাড়ি</button><button data-v="bus">🚌 বাস</button></div>
<button id="st">চালানো শুরু করো</button><br><button id="dlb">⬇ গেম ডাউনলোড করো</button>
<small>ডেভেলপার: Yakub Ansari<br>Discord bot, website, web3 ডেভেলপার · চট্টগ্রাম</small>
</div></div>
<script>
const $=id=>document.getElementById(id);
const R=80,W=28,B=R-W,roads=[-160,-80,0,80,160];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fd3f5);scene.fog=new THREE.Fog(0x9fd3f5,70,280);
const cam=new THREE.PerspectiveCamera(65,1,.5,500);
const rend=new THREE.WebGLRenderer({canvas:$('g'),antialias:true});rend.setPixelRatio(Math.min(devicePixelRatio,2));rend.shadowMap.enabled=true;rend.shadowMap.type=THREE.PCFSoftShadowMap;rend.shadowMap.mapSize.set(2048,2048);rend.outputColorSpace=THREE.SRGBColorSpace;rend.toneMapping=THREE.ACESFilmicToneMapping;rend.toneMappingExposure=1.12;
function rs(){rend.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
scene.add(new THREE.HemisphereLight(0xffffff,0x667766,1.15));
const sun=new THREE.DirectionalLight(0xfff0cc,.75);sun.position.set(60,120,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0015;Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:10,far:320});scene.add(sun,sun.target);
const sunB=new THREE.Mesh(new THREE.SphereGeometry(16,16,12),new THREE.MeshBasicMaterial({color:0xfff3b0,fog:false}));sunB.position.set(260,190,260);scene.add(sunB);
for(let i=0;i<9;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(30+Math.random()*30,6,14+Math.random()*10),new THREE.MeshBasicMaterial({color:0xffffff,fog:false,transparent:true,opacity:.85}));c.position.set(Math.random()*500-250,110+Math.random()*30,Math.random()*500-250);scene.add(c)}
const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||scene).add(m);return m}
function wheel(p,x,y,z,r){r=r||.45;const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.35,14),M(0x111111));m.rotation.z=Math.PI/2;m.position.set(x,y,z);p.add(m)}
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return new THREE.CanvasTexture(c)}
const ad=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};

// ground, roads
box(900,.1,900,0x7d8b6a,0,-.06,0);
const rt=cv(128,64,x=>{x.fillStyle='#292b2e';x.fillRect(0,0,128,64);x.fillStyle='#f5c542';x.fillRect(62,0,2,64);x.fillRect(66,0,2,64);x.fillStyle='#e8e8e8';for(let y=0;y<64;y+=16){x.fillRect(31,y,2,8);x.fillRect(95,y,2,8)}x.fillStyle='#c9c9c9';x.fillRect(2,0,2,64);x.fillRect(124,0,2,64)});
rt.wrapS=rt.wrapT=THREE.RepeatWrapping;const L=360+W;rt.repeat.set(1,L/32);
roads.forEach((r,i)=>{
  const mat=new THREE.MeshLambertMaterial({map:rt});
  const a=new THREE.Mesh(new THREE.PlaneGeometry(W,L),mat);a.rotation.x=-Math.PI/2;a.position.set(r,.02,0);a.receiveShadow=true;scene.add(a);
  const w=new THREE.Object3D();const b=new THREE.Mesh(new THREE.PlaneGeometry(W,L),mat);b.rotation.x=-Math.PI/2;b.receiveShadow=true;w.add(b);w.rotation.y=Math.PI/2;w.position.set(0,.03,r);scene.add(w);
});
roads.forEach(x=>roads.forEach(z=>box(W,.02,W,0x2b2b2e,x,.05,z)));
// raised sidewalk curbs, street lamps and planted roadside trees for richer city detail
roads.forEach(r=>[-1,1].forEach(side=>{
  const curb=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.35,380),M(0xbdbdbd));curb.position.set(r+side*(W/2+1.1),.22,0);scene.add(curb);
  const curb2=new THREE.Mesh(new THREE.BoxGeometry(380,0.35,2.2),M(0xbdbdbd));curb2.position.set(0,.22,r+side*(W/2+1.1));scene.add(curb2);
}));
for(let axis=0;axis<2;axis++)for(let r of roads)for(let pos=-140;pos<=140;pos+=40)for(let side of [-1,1]){
  const x=axis===0?r+side*19:pos,z=axis===0?pos:r+side*19;
  box(.35,7,.35,0x555b60,x,3.5,z);
  box(2.4,.25,.35,0x555b60,x+(axis===0?side*1.0:0),6.8,z+(axis===1?side*1.0:0));
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),new THREE.MeshBasicMaterial({color:0xffe7a1}));lamp.position.set(x+(axis===0?side*2:0),6.6,z+(axis===1?side*2:0));scene.add(lamp);
}

const zt=cv(64,16,x=>{x.fillStyle='#2b2b2e';x.fillRect(0,0,64,16);x.fillStyle='#f2f2f2';for(let i=0;i<8;i++)x.fillRect(i*8+1,0,4,16)});
roads.forEach(x=>roads.forEach(z=>[0,1,2,3].forEach(q=>{const a=q*Math.PI/2,m=new THREE.Mesh(new THREE.PlaneGeometry(14,3.5),new THREE.MeshLambertMaterial({map:zt}));m.rotation.set(-Math.PI/2,0,q%2?Math.PI/2:0);m.position.set(x+Math.sin(a)*11,.07,z+Math.cos(a)*11);scene.add(m)})));

// shops and buildings
const ST=[['চায়ের দোকান','#b5651d'],['মুদি দোকান','#2e7d32'],['ফার্মেসি','#0277bd'],['বিরিয়ানি হাউস','#c62828'],['মোবাইল সার্ভিসিং','#6a1b9a'],['কাপড়ের দোকান','#ad1457'],['ফলের দোকান','#ef6c00'],['সেলুন','#00838f']].map(([t,c])=>({c,tex:cv(256,64,x=>{x.fillStyle=c;x.fillRect(0,0,256,64);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(3,3,250,58);x.fillStyle='#fff';x.font='bold 28px "Noto Sans Bengali",Vrinda,"Nirmala UI",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,34)})}));
const walls=[0xf1e3c4,0xdfe8d0,0xd6e4ee,0xf0d4d4,0xe8d9f0];
const winT=cv(64,64,x=>{x.fillStyle='#e6e1d6';x.fillRect(0,0,64,64);for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.fillStyle=Math.random()<.3?'#ffd86b':'#4a6178';x.fillRect(8+i*32,8+j*32,18,20)}});
winT.wrapS=winT.wrapT=THREE.RepeatWrapping;
const mkS=(t,c)=>cv(512,128,x=>{x.fillStyle=c;x.fillRect(0,0,512,128);x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(6,6,500,116);x.fillStyle='#fff';x.font='bold 56px "Noto Sans Bengali",Vrinda,"Nirmala UI",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,256,68)});
const SPECIAL={'0,0':{c:0xf6d04d,t:mkS('আদর্শ স্কুল','#1565c0')},'1,2':{c:0xc9a27a,t:mkS('সরকারি কলেজ','#6a1b9a')},'3,1':{c:0xf8a5c2,t:mkS('কিন্ডারগার্টেন','#e91e63')}};
const BK=[];
for(let i=0;i<4;i++)for(let j=0;j<4;j++){
  const cx=(roads[i]+roads[i+1])/2,cz=(roads[j]+roads[j+1])/2;
  BK.push([cx,cz]);
  box(B,.3,B,0xb4b0a4,cx,.15,cz);
  const sp=SPECIAL[i+','+j],h=sp?10:16+Math.random()*28,t=winT.clone();t.needsUpdate=true;t.repeat.set(4,h/8);
  const cb=new THREE.Mesh(new THREE.BoxGeometry(30,h,30),new THREE.MeshLambertMaterial({map:t,color:sp?sp.c:walls[Math.random()*5|0]}));cb.position.set(cx,.3+h/2,cz);cb.castShadow=true;scene.add(cb);
  if(sp){[0,1,2,3].forEach(q=>{const a=q*Math.PI/2,pl=new THREE.Mesh(new THREE.PlaneGeometry(22,5.5),new THREE.MeshBasicMaterial({map:sp.t}));pl.position.set(cx+Math.sin(a)*15.1,.3+h-2.5,cz+Math.cos(a)*15.1);pl.rotation.y=a;scene.add(pl)});box(.3,8,.3,0xdddddd,cx,.3+h+4,cz);box(3,1.8,.1,0x00a651,cx+1.6,.3+h+7.2,cz)}
  [[-31,-31],[31,-31],[-31,31],[31,31]].forEach(c=>{box(.5,3,.5,0x6d4c41,cx+c[0],1.8,cz+c[1]);const tr=new THREE.Mesh(new THREE.ConeGeometry(2,5,8),M(0x2e7d32));tr.position.set(cx+c[0],5.8,cz+c[1]);tr.castShadow=true;scene.add(tr)});
  [0,2].forEach(s=>{const a=s*Math.PI/2,lx=cx+Math.sin(a)*32,lz=cz+Math.cos(a)*32;box(.2,6,.2,0x333333,lx,3.3,lz);box(.9,.3,.9,0xffeeaa,lx,6.5,lz)});
  for(let s=0;s<4;s++){
    const sg=new THREE.Object3D();sg.position.set(cx,.3,cz);sg.rotation.y=s*Math.PI/2;scene.add(sg);
    [-12,12].forEach(lx=>{
      const k=ST[Math.random()*ST.length|0],sh=6+Math.random()*3;
      box(16,sh,8,walls[Math.random()*5|0],lx,sh/2,19,sg);
      const sp=new THREE.Mesh(new THREE.PlaneGeometry(18,4.5),new THREE.MeshBasicMaterial({map:k.tex}));sp.position.set(lx,sh-3.2,23.05);sg.add(sp);
      box(16,.4,3,parseInt(k.c.slice(1),16),lx,4.3,24.5,sg);
      box(.3,4.3,.3,0x444444,lx-7.5,2.15,25.8,sg);box(.3,4.3,.3,0x444444,lx+7.5,2.15,25.8,sg);
    });
  }
}

// Extra city detail pack: rooftop water tanks, balconies, roadside greenery, signs and traffic signals
const tankMat=M(0x607d8b),leafMat=M(0x2e7d32),trunkMat=M(0x795548);
BK.forEach(([cx,cz],idx)=>{
  // rooftop water tank and rooftop antenna on selected buildings
  if(idx%2===0){
    const tank=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,2.3,12),tankMat);
    tank.position.set(cx+5,19+Math.random()*5,cz-4);tank.castShadow=true;scene.add(tank);
    box(.18,4,.18,0x555555,cx-5,20,cz+3);
    box(1.2,.15,.15,0xaaaaaa,cx-5,22,cz+3);
  }
  // planters near sidewalks (kept outside vehicle lanes)
  for(let side of [-1,1]){
    const x=cx+side*35,z=cz+(idx%3-1)*18;
    box(1.4,.6,1.4,0x9e7d5a,x,.35,z);
    const tree=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,7),leafMat);
    tree.position.set(x,2,z);tree.castShadow=true;scene.add(tree);
    box(.25,1.4,.25,0x795548,x,1,z);
  }
});
// Four-way traffic signal props at each junction
roads.forEach(x=>roads.forEach(z=>{
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const px=x+sx*(W/2+2.5),pz=z+sz*(W/2+2.5);
    box(.25,5,.25,0x333333,px,2.5,pz);
    box(.8,1.8,.45,0x222222,px,5.3,pz);
    [0xff3333,0xffc107,0x32cd32].forEach((color,k)=>{
      const lamp=new THREE.Mesh(new THREE.SphereGeometry(.19,8,8),new THREE.MeshBasicMaterial({color}));
      lamp.position.set(px,5.85-k*.55,pz+.25);scene.add(lamp);
    });
  });
}));

// pedestrian NPCs along sidewalks (simple Bangladeshi street crowd)
const pedestrians=[];
const skinColors=[0xc68642,0x9b653b,0xd19a69],shirtColors=[0x1565c0,0x2e7d32,0xc62828,0x6a1b9a,0xeeeeee,0xffa000,0x263238];
for(let i=0;i<120;i++){
  const p=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(.55,1.05,.32),M(shirtColors[Math.random()*shirtColors.length|0]));body.position.y=1.05;p.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),M(skinColors[Math.random()*skinColors.length|0]));head.position.y=1.72;p.add(head);
  const leg1=new THREE.Mesh(new THREE.BoxGeometry(.18,.65,.2),M(0x263238));leg1.position.set(-.14,.38,0);p.add(leg1);
  const leg2=leg1.clone();leg2.position.x=.14;p.add(leg2);
  const axis=Math.random()<.5,road=roads[Math.random()*roads.length|0],along=Math.random()*300-150,side=(Math.random()<.5?-1:1)*(10+Math.random()*2);
  p.position.set(axis?road+side:along,0,axis?along:road+side);p.rotation.y=Math.random()*Math.PI*2;scene.add(p);pedestrians.push({p,phase:Math.random()*6});
}

// City billboards and roadside signboards for a busier Bangladesh-inspired streetscape
for(let i=0;i<36;i++){
  const road=roads[Math.random()*roads.length|0],along=Math.random()*280-140,side=Math.random()<.5?-1:1;
  const x=road+side*24,z=along;
  box(.35,4,.35,0x555555,x,2,z);
  const panel=new THREE.Mesh(new THREE.BoxGeometry(5,2.4,.25),M([0x1565c0,0xc62828,0x2e7d32,0x6a1b9a][i%4]));
  panel.position.set(x+side*1.4,4.8,z);panel.castShadow=true;scene.add(panel);
  box(3.8,.08,.08,0xffffff,x+side*1.4,5.2,z+.15);
}

// vehicles
const PAL=[0xe53935,0x1e88e5,0xfdd835,0x43a047,0xff7043,0xab47bc,0x00acc1];
function mk(t){
  const g=new THREE.Group(),c=PAL[Math.random()*PAL.length|0],c2=PAL[Math.random()*PAL.length|0];
  if(t==='car'){
    box(2,.75,4.4,0xffffff,0,.85,0,g);box(1.8,.7,2.3,0xffffff,0,1.55,-.2,g);box(1.84,.45,2.1,0x1b2a3a,0,1.6,-.2,g);
    [.65,-.65].forEach(x=>{box(.5,.2,.1,0xffffcc,x,.9,2.2,g);box(.5,.2,.1,0xff2222,x,.9,-2.2,g)});
    [[1,1.4],[-1,1.4],[1,-1.4],[-1,-1.4]].forEach(a=>wheel(g,a[0],.45,a[1]));
  }else if(t==='bus'){
    box(2.6,2.4,9,0xd01818,0,1.9,0,g);box(2.64,.8,7.8,0x1b2a3a,0,2.5,-.2,g);box(2.2,1,.1,0x1b2a3a,0,2.4,4.52,g);box(2.64,.2,9.04,0x8a0f0f,0,1.2,0,g);
    [.9,-.9].forEach(x=>{box(.5,.25,.1,0xffffcc,x,1.1,4.52,g);box(.5,.25,.1,0xff8888,x,1.1,-4.52,g)});
    [[1.3,3],[-1.3,3],[1.3,-3],[-1.3,-3]].forEach(a=>wheel(g,a[0],.6,a[1],.6));
  }else{
    wheel(g,0,.5,1.5,.5);wheel(g,.6,.5,-.3,.5);wheel(g,-.6,.5,-.3,.5);
    box(1.2,.35,1.5,c2,0,.75,-.5,g);box(1,.3,.9,0x222222,0,1.05,-.6,g);
    box(1.3,.12,1.7,c,0,2.1,-.5,g);box(.08,1,.08,0x333333,.6,1.6,.2,g);box(.08,1,.08,0x333333,-.6,1.6,.2,g);
    box(1.2,1.1,.1,c,0,1.55,-1.25,g);box(.4,.6,.3,0x2e7d32,0,1.4,.7,g);box(.3,.3,.3,0xc68642,0,1.85,.7,g);
    box(.1,.1,.9,0x555555,0,1.0,1.0,g);box(.8,.06,.06,0x222222,0,1.3,1.5,g);
  }
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g;
}
const VT={rick:{mv:13,ac:14,tr:1.9,d:9,h:5,r:1.6,n:'রিকশা'},car:{mv:34,ac:26,tr:1.6,d:11,h:5.5,r:2.2,n:'সাদা গাড়ি'},bus:{mv:24,ac:16,tr:1.1,d:17,h:8,r:3,n:'লাল বাস'}};
let SV={};try{SV=JSON.parse(localStorage.getItem('dr')||'{}')}catch(e){}
const owned=Object.assign({rick:1},SV.owned||{});let st2=0;
function say(m,c){const T=$('toast');T.textContent=m;T.style.background=c||'#c62828';T.style.opacity=1;clearTimeout(st2);st2=setTimeout(()=>T.style.opacity=0,1600)}
let type='rick',pm=null;const P={x:4,z:-60,h:0,v:0,ch:0};
function sw(t){if(!owned[t]){say('🔒 গ্যারেজ (G) থেকে কিনতে হবে');return}type=t;if(pm)scene.remove(pm);pm=mk(t);scene.add(pm);$('vn').textContent=VT[t].n;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===t))}
sw('rick');
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>sw(b.dataset.v));

// traffic
const npcs=[];
function spawn(){
  const q=Math.random(),ty=q<.4?'car':q<.65?'bus':'rick',i=Math.random()*4|0,c=roads[i]+10+Math.random()*60,r=roads[Math.random()*5|0];
  const m=mk(ty);scene.add(m);
  const z=Math.random()<.5,n={ty,m,s:ty==='car'?14:ty==='bus'?10:6};
  if(z){n.x=r;n.z=c;n.hd=Math.random()<.5?0:2}else{n.x=c;n.z=r;n.hd=Math.random()<.5?1:3}
  n.m.position.set(n.x,0,n.z);npcs.push(n);
}
for(let i=0;i<140;i++)spawn();
function stepN(n,dt){
  const a=n.hd*Math.PI/2,dx=Math.round(Math.sin(a)),dz=Math.round(Math.cos(a));
  const ox=n.x,oz=n.z;n.x+=dx*n.s*dt;n.z+=dz*n.s*dt;
  const o=dx?ox:oz,nw=dx?n.x:n.z,k=Math.round(nw/80)*80;
  if((o-k)*(nw-k)<0){
    if(dx)n.x=k;else n.z=k;
    const opts=[n.hd,n.hd,n.hd+1,n.hd+3];if(Math.random()<.1)opts.push(n.hd+2);
    const ok=opts.filter(h=>{h=(h%4+4)%4;const ax=n.x+Math.round(Math.sin(h*Math.PI/2))*80,az=n.z+Math.round(Math.cos(h*Math.PI/2))*80;return Math.abs(ax)<=161&&Math.abs(az)<=161});
    n.hd=((ok.length?ok[Math.random()*ok.length|0]:n.hd+2)%4+4)%4;
  }
  const a2=n.hd*Math.PI/2,tx=n.x+Math.cos(a2)*4,tz=n.z-Math.sin(a2)*4,f=1-Math.exp(-6*dt);
  n.m.position.x+=(tx-n.m.position.x)*f;n.m.position.z+=(tz-n.m.position.z)*f;
  n.m.rotation.y+=ad(n.m.rotation.y,a2)*f;
}

// input
const K={};let ac=null;
function horn(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=type==='bus'?190:type==='car'?330:520;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='Digit1')sw('rick');if(e.code==='Digit2')sw('car');if(e.code==='Digit3')sw('bus');if(e.code==='KeyH')horn();if(e.code==='KeyG'){gar();$('gar').style.display=$('gar').style.display==='flex'?'none':'flex'}if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{K[k]=1;e.preventDefault()};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>K[k]=0))});
let play=false;
$('dlb').onclick=()=>{const h='<!DOCTYPE html>\n'+document.documentElement.outerHTML,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='dhaka-road.html';a.click()};
$('st').onclick=()=>{$('ov').style.display='none';play=true;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}};

// passenger stops, money, garage
const CAP={rick:2,car:4,bus:15},RATE={rick:1,car:1.5,bus:.8},PR={rick:0,car:2000,bus:1000},NM={rick:'🛺 রিকশা',car:'🚗 সাদা গাড়ি',bus:'🚌 লাল বাস'};
let money=SV.money||0,earned=SV.earned||0;const onb=[],stops=[],PC=[0xe53935,0x1e88e5,0xfdd835,0x43a047,0x8e24aa,0xfb8c00];
function sv(){try{localStorage.setItem('dr',JSON.stringify({money,earned,owned}))}catch(e){}}
BK.forEach(b=>[1,3].forEach(s=>{const a=s*Math.PI/2,x=b[0]+Math.sin(a)*31.4,z=b[1]+Math.cos(a)*31.4,g=new THREE.Group();g.position.set(x,.3,z);g.rotation.y=a;scene.add(g);
 box(3.6,.2,2,0x1565c0,0,3.2,-1.2,g);box(.15,3,.15,0x555555,-1.7,1.5,-1.9,g);box(.15,3,.15,0x555555,1.7,1.5,-1.9,g);
 const figs=[0,1,2].map(k=>{const f=new THREE.Group();f.position.set(-1+k,0,-.2);box(.5,1,.3,PC[Math.random()*6|0],0,1.1,0,f);box(.35,.35,.35,0xc68642,0,1.8,0,f);box(.5,.6,.3,0x222222,0,.3,0,f);g.add(f);f.visible=false;return f});
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,16,16,1,true),new THREE.MeshBasicMaterial({color:0xffd600,transparent:true,opacity:.3,side:THREE.DoubleSide}));beam.position.y=8;beam.visible=false;g.add(beam);
 stops.push({x,z,figs,beam,n:0})}));
function addPax(){const c=stops.filter(s=>s.n<3);if(!c.length||stops.reduce((a,s)=>a+s.n,0)>=16)return;c[Math.random()*c.length|0].n++}
for(let i=0;i<9;i++)addPax();
let pt=0,hold=0;
function stopStep(dt){
 pt-=dt;if(pt<0){pt=5;addPax()}
 const need=new Set(onb.map(p=>p.d));
 stops.forEach((s,i)=>{s.figs.forEach((f,k)=>f.visible=k<s.n);const w=s.n>0&&onb.length<CAP[type],d=need.has(i);s.beam.visible=w||d;s.beam.material.color.set(d?0x00e676:0xffd600)});
 const i=stops.findIndex(s=>Math.hypot(s.x-P.x,s.z-P.z)<12);
 if(i>=0&&Math.abs(P.v)<2.5){hold+=dt;if(hold>.6){hold=0;const s=stops[i];let gain=0,out=0,inn=0;
  for(let k=onb.length-1;k>=0;k--)if(onb[k].d===i){const p=onb.splice(k,1)[0];gain+=400+Math.floor(Math.random()*101);out++}
  while(s.n>0&&onb.length<CAP[type]){s.n--;let d,t=0;do{d=Math.random()*stops.length|0}while((d===i||Math.hypot(stops[d].x-s.x,stops[d].z-s.z)<90)&&++t<30);onb.push({o:i,d});inn++}
  if(gain){money+=gain;earned+=gain;say('💰 '+out+' জন নামল · ভাড়া +৳'+gain,'#2e7d32');sv()}else if(inn)say('🧍 '+inn+' জন যাত্রী উঠল, সবুজ বিমে নামাও','#1565c0')
 }}else hold=0;
}
function gar(){$('gp').innerHTML='<h2 style="margin:0 0 8px">🏪 গ্যারেজ</h2><p>তোমার টাকা: ৳'+money+'</p>'+['rick','car','bus'].map(k=>'<div style="margin:8px 0">'+NM[k]+' <button data-b="'+k+'" style="padding:8px 12px;border:0;border-radius:8px;font-weight:700">'+(owned[k]?'চালাও':'কিনো ৳'+PR[k])+'</button></div>').join('')+'<button id="gx" style="margin-top:8px;padding:8px 14px;border:0;border-radius:8px">বন্ধ করো</button>'}
$('gb').onclick=()=>{gar();$('gar').style.display='flex'};
$('gar').onclick=e=>{const k=e.target.dataset&&e.target.dataset.b;if(e.target.id==='gx'||e.target===$('gar')){$('gar').style.display='none';return}
 if(!k)return;if(!owned[k]){if(money>=PR[k]){money-=PR[k];owned[k]=1;sv();say('✅ কেনা হলো!','#2e7d32')}else{say('টাকা কম!');return}}sw(k);gar()};
// green guide line on the road
const GR=new Float32Array(8*18),gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(GR,3));gg.setDrawRange(0,0);
const gm=new THREE.MeshBasicMaterial({color:0x00e676,transparent:true,opacity:.9,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
const gl=new THREE.Mesh(gg,gm);gl.frustumCulled=false;scene.add(gl);
let route=[],rcol='#00e676';
function snap(x,z){const bx=roads.reduce((a,r)=>Math.abs(r-x)<Math.abs(a-x)?r:a),bz=roads.reduce((a,r)=>Math.abs(r-z)<Math.abs(a-z)?r:a),cl=v=>Math.max(-160,Math.min(160,v));
 return Math.abs(bx-x)<=Math.abs(bz-z)?{v:1,r:bx,c:cl(z)}:{v:0,r:bz,c:cl(x)}}
function ends(p){const lo=Math.max(...roads.filter(q=>q<=p.c)),hi=Math.min(...roads.filter(q=>q>=p.c));return [lo,hi].map(c=>p.v?[p.r,c]:[c,p.r])}
function mkRoute(ax,az,bx,bz){
 const A=snap(ax,az),Bp=snap(bx,bz),pa=A.v?[A.r,A.c]:[A.c,A.r],pb=Bp.v?[Bp.r,Bp.c]:[Bp.c,Bp.r];
 if(A.v===Bp.v&&A.r===Bp.r)return [pa,pb];
 let best=null,bl=1e9;
 ends(A).forEach(e=>ends(Bp).forEach(f=>{
  const back=((e[0]-P.x)*Math.sin(P.h)+(e[1]-P.z)*Math.cos(P.h))<0?40:0;
  const l=Math.abs(e[0]-f[0])+Math.abs(e[1]-f[1])+Math.abs(e[0]-pa[0])+Math.abs(e[1]-pa[1])+Math.abs(f[0]-pb[0])+Math.abs(f[1]-pb[1])+back;
  if(l<bl){bl=l;best=[pa,e,[f[0],e[1]],f,pb]}}));
 return best}
function guide(tm){
 let tg=null,col=0x00e676;const near=a=>a.reduce((m,s)=>Math.hypot(s.x-P.x,s.z-P.z)<Math.hypot(m.x-P.x,m.z-P.z)?s:m);
 if(onb.length)tg=near(onb.map(p=>stops[p.d]));
 else{const w=stops.filter(s=>s.n>0);if(w.length){tg=near(w);col=0xffd600}}
 route=tg&&Math.hypot(tg.x-P.x,tg.z-P.z)>14?mkRoute(P.x,P.z,tg.x,tg.z):[];
 rcol=col===0x00e676?'#00e676':'#ffd600';
 let n=0;
 for(let i=0;i<route.length-1;i++){
  const a=route[i],b=route[i+1],dx=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(dx,dz);if(l<.01)continue;
  const ox=-dz/l*.8,oz=dx/l*.8,y=.12;
  const v=[a[0]+ox,y,a[1]+oz,a[0]-ox,y,a[1]-oz,b[0]+ox,y,b[1]+oz,a[0]-ox,y,a[1]-oz,b[0]-ox,y,b[1]-oz,b[0]+ox,y,b[1]+oz];
  GR.set(v,n*18);n++}
 gg.attributes.position.needsUpdate=true;gg.setDrawRange(0,n*6);
 gm.color.set(col);gm.opacity=.65+.3*Math.sin(tm*6);
}
// minimap
const mm=$('mm').getContext('2d'),S=170,ks=S/380;
const MX=x=>S/2-x*ks,MY=z=>S/2-z*ks;
function drawMap(){
  mm.fillStyle='#233023';mm.fillRect(0,0,S,S);
  mm.strokeStyle='#8a8a8a';mm.lineWidth=W*ks;
  roads.forEach(r=>{mm.beginPath();mm.moveTo(MX(r),0);mm.lineTo(MX(r),S);mm.moveTo(0,MY(r));mm.lineTo(S,MY(r));mm.stroke()});
  if(route.length>1){mm.strokeStyle=rcol;mm.lineWidth=3;mm.beginPath();route.forEach((p,i)=>i?mm.lineTo(MX(p[0]),MY(p[1])):mm.moveTo(MX(p[0]),MY(p[1])));mm.stroke()}
  const nd=new Set(onb.map(p=>p.d));stops.forEach((s,i)=>{if(nd.has(i)||s.n>0){mm.fillStyle=nd.has(i)?'#00e676':'#ffd600';mm.beginPath();mm.arc(MX(s.x),MY(s.z),3.5,0,7);mm.fill()}});
  npcs.forEach(n=>{mm.fillStyle=n.ty==='bus'?'#ff3b3b':n.ty==='car'?'#fff':'#ffd54f';mm.fillRect(MX(n.m.position.x)-1.5,MY(n.m.position.z)-1.5,3,3)});
  const px=MX(P.x),py=MY(P.z),fx=-Math.sin(P.h),fy=-Math.cos(P.h);
  mm.fillStyle='#00e5ff';mm.beginPath();mm.moveTo(px+fx*9,py+fy*9);mm.lineTo(px-fx*5-fy*5,py-fy*5+fx*5);mm.lineTo(px-fx*5+fy*5,py-fy*5-fx*5);mm.fill();
  mm.fillStyle='#fff';mm.font='bold 11px sans-serif';mm.fillText('N',S/2-3,12);
}

// loop
let fine=0,fcd=0,tt=0;const FN={rick:10,car:10,bus:10};
function hit(w){if(fcd>0)return;fcd=1.5;fine+=FN[type];money=Math.max(0,money-FN[type]);$('toast').style.background='#c62828';$('fn').textContent='জরিমানা: ৳'+fine;const T=$('toast');T.textContent='💥 '+w+' ধাক্কা! জরিমানা ৳'+FN[type];T.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>T.style.opacity=0,1400)}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const t=VT[type];
  if(play){
    fcd-=dt;stopStep(dt);guide(now/1000);$('mn').textContent='💵 ৳'+money+' · আয় ৳'+earned;$('ob').textContent='🧍 '+onb.length+'/'+CAP[type];const up=K.KeyW||K.ArrowUp,dn=K.KeyS||K.ArrowDown,lt=K.KeyA||K.ArrowLeft,rt2=K.KeyD||K.ArrowRight;
    if(up)P.v+=t.ac*dt;else if(dn)P.v-=(P.v>0?t.ac*2.2:t.ac*.6)*dt;else P.v-=Math.sign(P.v)*Math.min(Math.abs(P.v),6*dt);
    if(K.Space)P.v-=Math.sign(P.v)*Math.min(Math.abs(P.v),t.ac*3*dt);
    P.v=Math.max(-t.mv*.35,Math.min(t.mv,P.v));
    P.h+=((lt?1:0)-(rt2?1:0))*t.tr*dt*Math.min(1,Math.abs(P.v)/5)*Math.sign(P.v);
    P.x+=Math.sin(P.h)*P.v*dt;P.z+=Math.cos(P.h)*P.v*dt;
    P.x=Math.max(-175,Math.min(175,P.x));P.z=Math.max(-175,Math.min(175,P.z));
    BK.forEach(b=>{const hb=15+t.r*.5,dx=P.x-b[0],dz=P.z-b[1];
      if(Math.abs(dx)<hb&&Math.abs(dz)<hb){const px=hb-Math.abs(dx),pz=hb-Math.abs(dz);if(px<pz)P.x+=Math.sign(dx||1)*px;else P.z+=Math.sign(dz||1)*pz;P.v*=.6;if(Math.abs(P.v)>1.5)hit('বিল্ডিংয়ে')}});
    npcs.forEach(n=>{const dx=P.x-n.m.position.x,dz=P.z-n.m.position.z,d=Math.hypot(dx,dz),m=t.r+(n.ty==='bus'?4.8:n.ty==='car'?2.5:1.8);/* collision only at close physical contact */if(d<m&&d>.01){P.x+=dx/d*(m-d)*.5;P.z+=dz/d*(m-d)*.5;P.v*=.93;hit(n.ty==='bus'?'বাসে':n.ty==='car'?'গাড়িতে':'রিকশায়')}});
  }
  pedestrians.forEach((w,i)=>{w.phase+=dt;w.p.position.y=.025*Math.sin(w.phase*2);w.p.rotation.y+=.03*Math.sin(w.phase+i)*dt});
  npcs.forEach(n=>stepN(n,dt));
  pm.position.set(P.x,0,P.z);pm.rotation.y=P.h;sun.position.set(P.x+60,120,P.z+40);sun.target.position.set(P.x,0,P.z);
  P.ch+=ad(P.ch,P.h)*(1-Math.exp(-4*dt));
  const fx=Math.sin(P.ch),fz=Math.cos(P.ch);
  cam.position.set(P.x-fx*t.d,t.h,P.z-fz*t.d);cam.lookAt(P.x+fx*8,1.6,P.z+fz*8);
  $('spd').textContent=Math.round(Math.abs(P.v)*3);
  drawMap();rend.render(scene,cam);
}
requestAnimationFrame(loop);
</script>
